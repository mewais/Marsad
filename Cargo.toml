[workspace]
resolver = "2"
members = [
    "crates/marsad-proto",
    "crates/marsad-store",
    "crates/marsad-agent",
    "crates/marsad-client",
    "crates/marsad-fake-cli",
]
# The Tauri shell builds on its own (and is rewritten next); it is not part of this workspace.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
# Wasit (driver + session-runtime library), pinned by branch. Local development overrides
# these with the sibling checkout through an untracked `.cargo/config.toml` (see README).
wasit-core = { git = "https://github.com/mewais/Wasit", branch = "session-flows" }
wasit-control = { git = "https://github.com/mewais/Wasit", branch = "session-flows" }
wasit-runtime = { git = "https://github.com/mewais/Wasit", branch = "session-flows" }
wasit-shim = { git = "https://github.com/mewais/Wasit", branch = "session-flows" }
wasit-fake-cli = { git = "https://github.com/mewais/Wasit", branch = "session-flows" }
wasit-process = { git = "https://github.com/mewais/Wasit", branch = "session-flows" }
# Wasl (agent-to-agent layer), pinned by branch; it depends on the same Wasit git source, so one
# copy of Wasit is resolved. Local development patches it to `../Wasl` the same way.
wasl-proto = { git = "https://github.com/mewais/Wasl", branch = "session-flows" }
wasl-node = { git = "https://github.com/mewais/Wasl", branch = "session-flows" }
wasl-mcp = { git = "https://github.com/mewais/Wasl", branch = "session-flows" }

marsad-proto = { path = "crates/marsad-proto" }
marsad-store = { path = "crates/marsad-store" }
marsad-client = { path = "crates/marsad-client" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
fastrand = "2"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }

[profile.release]
lto = true
strip = true
