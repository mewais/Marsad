name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Wasit is fetched from GitHub as a git dependency (public repository; a private one would
  # need a token with read access, e.g. via CARGO_NET_GIT_FETCH_WITH_CLI + a credential helper).
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: TypeScript wire types match the Rust ones
        run: |
          cargo run -q -p marsad-proto --features ts --bin marsad-ts-export -- apps/desktop/src/bridge/generated
          test -z "$(git status --porcelain -- apps/desktop/src/bridge/generated)" || { git status --short -- apps/desktop/src/bridge/generated; git diff --stat; exit 1; }

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: sshd for remote-host tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server openssh-client
          sudo mkdir -p /run/sshd
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - name: Secrets in a real Secret Service (gnome-keyring on a private session bus)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y gnome-keyring
          dbus-run-session -- sh -c 'eval "$(printf "ci-keyring\n" | gnome-keyring-daemon --unlock --components=secrets)" && cargo test -p marsad-store --test secrets -- --include-ignored --nocapture'

  desktop:
    # The Tauri shell: build the frontend, then build (and on Linux lint/test) the app.
    # Packaging and signing come later.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: WebKitGTK and tray libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: pnpm build
        working-directory: apps/desktop
      - name: UI unit tests
        if: runner.os == 'Linux'
        run: pnpm test
        working-directory: apps/desktop
      - run: cargo build --features custom-protocol
        working-directory: apps/desktop/src-tauri
      - name: Translucent window over a vivid backdrop (screenshots)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File apps/desktop/e2e-real/translucency.ps1 -App apps/desktop/src-tauri/target/debug/marsad-desktop.exe -Out translucency
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: translucency-windows
          path: |
            translucency/*.png
            translucency/*.log
      - name: Lint and unit tests
        if: runner.os == 'Linux'
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --features custom-protocol --all-targets -- -D warnings
          cargo test --features custom-protocol

  linux-helper:
    # The static Linux helper and fake CLI the Windows end-to-end job installs into WSL.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-helper
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build -p marsad-agent -p marsad-fake-cli --target x86_64-unknown-linux-musl
      - name: Collect
        run: |
          mkdir -p out/x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/debug/marsad-agent out/x86_64-unknown-linux-musl/
          cp target/x86_64-unknown-linux-musl/debug/wasit-fake-cli out/
          strip out/x86_64-unknown-linux-musl/marsad-agent out/wasit-fake-cli
          file out/x86_64-unknown-linux-musl/marsad-agent out/wasit-fake-cli
      - uses: actions/upload-artifact@v4
        with:
          name: linux-helper
          path: out/
          retention-days: 3

  windows-e2e:
    # Real Windows: a WSL host end to end (hub lists distros, provisions the Linux helper into
    # the distro, a fake-CLI session's gate round-trips, the link survives `wsl --terminate`)
    # and the no-console-window checks; ssh from Windows to Linux (sshd inside the distro);
    # this runner as a native Windows host over ssh (OpenSSH Server on localhost).
    needs: linux-helper
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MARSAD_E2E_WSL_DISTRO: Ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-e2e
      - uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-24.04
      - uses: actions/download-artifact@v4
        with:
          name: linux-helper
          path: linux-bin
      - name: Linux fake CLI as `claude` inside the distro
        shell: pwsh
        run: |
          $p = (Resolve-Path linux-bin/wasit-fake-cli).Path -replace '\\','/'
          $p = '/mnt/' + $p.Substring(0,1).ToLower() + $p.Substring(2)
          wsl.exe -d $env:MARSAD_E2E_WSL_DISTRO -u root --exec sh -c "install -m 755 '$p' /usr/local/bin/claude && claude --version && uname -a"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Problem 2 reproduction: `kilo` only on a PATH that ~/.bashrc adds (nvm style, after
          # the interactive guard), as on the owner's distro. Discovery must find it.
          wsl.exe -d $env:MARSAD_E2E_WSL_DISTRO -u root --exec sh -c "mkdir -p /root/.nvm/versions/node/v22.11.0/bin && install -m 755 '$p' /root/.nvm/versions/node/v22.11.0/bin/kilo && echo 'export PATH=/root/.nvm/versions/node/v22.11.0/bin:`$PATH' >> /root/.bashrc && tail -2 /root/.bashrc && head -10 /root/.bashrc && whoami && (command -v kilo || echo kilo is not on the bare PATH)"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          wsl.exe --list --verbose
      - name: sshd inside the distro (key auth) for the ssh-from-Windows test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.ssh" | Out-Null
          cmd /c 'ssh-keygen -q -t ed25519 -N "" -f "%USERPROFILE%\.ssh\marsad_e2e"'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $p = "$env:USERPROFILE\.ssh\marsad_e2e.pub" -replace '\\','/'
          $p = '/mnt/' + $p.Substring(0,1).ToLower() + $p.Substring(2)
          wsl.exe -d $env:MARSAD_E2E_WSL_DISTRO -u root --exec sh -c "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server >/dev/null && ssh-keygen -A && mkdir -p /root/.ssh && cp '$p' /root/.ssh/authorized_keys && chmod 700 /root/.ssh && chmod 600 /root/.ssh/authorized_keys && printf 'SetEnv MARSAD_BUILD_ID=e2e-ssh\nPermitRootLogin prohibit-password\n' > /etc/ssh/sshd_config.d/marsad.conf && mkdir -p /run/sshd && /usr/sbin/sshd -t"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: OpenSSH Server on this runner (key auth) for the native Windows host test
        shell: pwsh
        run: |
          $v = 'v9.5.0.0p1-Beta'
          Invoke-WebRequest "https://github.com/PowerShell/Win32-OpenSSH/releases/download/$v/OpenSSH-Win64.zip" -OutFile "$env:RUNNER_TEMP\openssh.zip"
          Expand-Archive "$env:RUNNER_TEMP\openssh.zip" -DestinationPath 'C:\Program Files\OpenSSH' -Force
          $dir = 'C:\Program Files\OpenSSH\OpenSSH-Win64'
          powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\install-sshd.ps1"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Service sshd
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.ssh" | Out-Null
          cmd /c 'ssh-keygen -q -t ed25519 -N "" -f "%USERPROFILE%\.ssh\marsad_winssh"'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The image may come with an sshd_config of its own: use a known one (key auth; an
          # administrator's keys are in administrators_authorized_keys, which must be writable
          # by Administrators and SYSTEM only), logging to a file for diagnosis.
          Set-Content -Encoding ascii 'C:\ProgramData\ssh\sshd_config' @(
            'Port 22', 'PubkeyAuthentication yes', 'PasswordAuthentication no',
            'AuthorizedKeysFile .ssh/authorized_keys', 'SyslogFacility LOCAL0', 'LogLevel DEBUG2',
            'Subsystem sftp sftp-server.exe',
            'Match Group administrators',
            '       AuthorizedKeysFile __PROGRAMDATA__/ssh/administrators_authorized_keys')
          $pub = Get-Content "$env:USERPROFILE\.ssh\marsad_winssh.pub"
          Set-Content -Encoding ascii 'C:\ProgramData\ssh\administrators_authorized_keys' $pub
          icacls 'C:\ProgramData\ssh\administrators_authorized_keys' /inheritance:r /grant '*S-1-5-32-544:F' /grant '*S-1-5-18:F'
          Set-Content -Encoding ascii "$env:USERPROFILE\.ssh\authorized_keys" $pub
          Restart-Service sshd
          Get-Service sshd
          whoami /groups | Select-String -SimpleMatch 'S-1-5-32-544'
          ssh -i "$env:USERPROFILE\.ssh\marsad_winssh" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$env:USERNAME@127.0.0.1" "echo ssh to this runner works for %USERNAME% & (where sh || echo no sh on PATH)"
          if ($LASTEXITCODE -ne 0) {
            Get-Content 'C:\ProgramData\ssh\logs\sshd.log' -Tail 60 -ErrorAction Continue
            exit 1
          }
      - run: cargo build -p marsad-agent --tests
      - name: WSL end to end + no console windows
        shell: pwsh
        run: |
          $env:MARSAD_E2E_LINUX_BIN_DIR = (Resolve-Path linux-bin).Path
          $env:MARSAD_E2E_SSH_KEY = "$env:USERPROFILE\.ssh\marsad_e2e"
          $env:MARSAD_E2E_WINSSH_KEY = "$env:USERPROFILE\.ssh\marsad_winssh"
          cargo test -p marsad-agent --test windows -- --include-ignored --nocapture --test-threads 1
