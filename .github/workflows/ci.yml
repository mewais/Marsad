name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Wasit is fetched from GitHub as a git dependency (public repository; a private one would
  # need a token with read access, e.g. via CARGO_NET_GIT_FETCH_WITH_CLI + a credential helper).
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: sshd for remote-host tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server openssh-client
          sudo mkdir -p /run/sshd
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  desktop:
    # The Tauri shell: build the frontend, then build (and on Linux lint/test) the app.
    # Packaging and signing come later.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: WebKitGTK and tray libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: pnpm build
        working-directory: apps/desktop
      - run: cargo build --features custom-protocol
        working-directory: apps/desktop/src-tauri
      - name: Lint and unit tests
        if: runner.os == 'Linux'
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --features custom-protocol --all-targets -- -D warnings
          cargo test --features custom-protocol
