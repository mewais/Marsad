name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Wasit is fetched from GitHub as a git dependency (public repository; a private one would
  # need a token with read access, e.g. via CARGO_NET_GIT_FETCH_WITH_CLI + a credential helper).
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: sshd for remote-host tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server openssh-client
          sudo mkdir -p /run/sshd
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
