<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Marsad — مرصد</title>
    <style>
      *{box-sizing:border-box}
      /* Self-hosted symbol fallback: makes the UI glyph-icons (▾ ⚙ ⛶ ⌕ ⏸ ↻ ⎇ ⎋ ⎈ …)
         render even on systems whose default fonts lack them (e.g. WebKitGTK with no
         symbol fallback). Subset to only the glyphs the app uses (~4KB total). */
      @font-face{font-family:'Marsad Symbols';font-style:normal;font-weight:400;font-display:swap;
        src:url('/fonts/marsad-symbols-geo.woff2') format('woff2');
        unicode-range:U+2500,U+2192,U+25CF,U+26A0,U+2715,U+2699,U+2318,U+25CB,U+2713,U+229F,U+2212,U+2265,U+23CE,U+25A1,U+2387,U+21BB,U+21A7,U+21A5,U+276F,U+25B2,U+2600,U+263E,U+25BE,U+25A6,U+21E7,U+21B5}
      @font-face{font-family:'Marsad Symbols';font-style:normal;font-weight:400;font-display:swap;
        src:url('/fonts/marsad-symbols-tech.woff2') format('woff2');
        unicode-range:U+24D8,U+26F6,U+26ED,U+2388,U+2315,U+238B}
      @font-face{font-family:'Marsad Symbols';font-style:normal;font-weight:400;font-display:swap;
        src:url('/fonts/marsad-symbols-misc.woff2') format('woff2');
        unicode-range:U+23F8}
      html{margin:0;height:100%;background:transparent}
      /* Opaque by default (solid app). The "Translucent surfaces" toggle makes the
         body + surface tokens translucent at runtime (ThemeProvider), revealing the OS
         window material (Windows `mica`). NO `backdrop-filter` here — over a transparent
         WebView2 window it renders opaque (black), which defeated translucency. */
      body{margin:0;height:100%;font-family:'Hanken Grotesk','Marsad Symbols',system-ui,sans-serif;background:#0e1116;color:#e8ecf1;-webkit-font-smoothing:antialiased}
      .mono{font-family:'JetBrains Mono','Marsad Symbols',monospace}
      ::-webkit-scrollbar{width:9px;height:9px}
      ::-webkit-scrollbar-thumb{background:var(--border2,#313a48);border-radius:6px}
      ::-webkit-scrollbar-track{background:transparent}
      ::selection{background:var(--accent-bg,rgba(91,141,239,0.14))}
      @keyframes dotpulse{0%,100%{opacity:1}50%{opacity:.35}}
      @keyframes glow{0%,100%{box-shadow:0 0 0 1px var(--needs,#f1a83a),0 0 0 5px rgba(241,168,58,0.10)}50%{box-shadow:0 0 0 1px var(--needs,#f1a83a),0 0 22px 2px rgba(241,168,58,0.22)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes slideup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      @keyframes slideleft{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
      /* Markdown rendering for assistant transcript messages (.md = react-markdown wrapper) */
      .md{overflow-wrap:anywhere}
      .md>:first-child{margin-top:0}
      .md>:last-child{margin-bottom:0}
      .md p{margin:0 0 8px}
      .md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:14px 0 7px;line-height:1.3;font-weight:650}
      .md h1{font-size:1.35em}.md h2{font-size:1.22em}.md h3{font-size:1.1em}
      .md h4,.md h5,.md h6{font-size:1em}
      .md ul,.md ol{margin:0 0 8px;padding-left:1.4em}
      .md li{margin:2px 0}
      .md li>ul,.md li>ol{margin:2px 0}
      .md a{color:var(--accent,#5b8def);text-decoration:none}
      .md a:hover{text-decoration:underline}
      .md strong{font-weight:650}
      .md code{font-family:'JetBrains Mono','Marsad Symbols',monospace;font-size:.88em;
        background:var(--panel2,#1a1f27);border:1px solid var(--border,#2a323d);
        border-radius:5px;padding:1px 5px}
      .md pre{background:var(--panel2,#1a1f27);border:1px solid var(--border,#2a323d);
        border-radius:9px;padding:11px 13px;margin:0 0 9px;overflow-x:auto}
      .md pre code{background:none;border:none;padding:0;font-size:.86em;line-height:1.55}
      .md blockquote{margin:0 0 9px;padding:2px 0 2px 12px;border-left:3px solid var(--border2,#313a48);color:var(--txt2,#aeb6c2)}
      .md hr{border:none;border-top:1px solid var(--border,#2a323d);margin:12px 0}
      .md table{border-collapse:collapse;margin:0 0 9px;display:block;overflow-x:auto}
      .md th,.md td{border:1px solid var(--border,#2a323d);padding:5px 9px;text-align:left}
      .md th{background:var(--panel2,#1a1f27);font-weight:650}
      .md img{max-width:100%}
      /* Prompt bubble overrides: white text on accent background */
      .md-bubble .md a{color:rgba(255,255,255,0.85);text-decoration:underline}
      .md-bubble .md a:hover{color:#fff}
      .md-bubble .md code{background:rgba(0,0,0,0.18);border-color:rgba(255,255,255,0.20);color:#fff}
      .md-bubble .md pre{background:rgba(0,0,0,0.18);border-color:rgba(255,255,255,0.20)}
      .md-bubble .md pre code{color:#fff}
      .md-bubble .md blockquote{border-left-color:rgba(255,255,255,0.40);color:rgba(255,255,255,0.80)}
      .md-bubble .md hr{border-top-color:rgba(255,255,255,0.30)}
      .md-bubble .md th,.md-bubble .md td{border-color:rgba(255,255,255,0.25)}
      .md-bubble .md th{background:rgba(0,0,0,0.15)}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
