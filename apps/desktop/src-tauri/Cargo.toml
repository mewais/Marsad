[package]
name = "marsad-desktop"
version = "0.2.0"
edition = "2021"
authors = ["Mohammad Ewais <mohammad.a.ewais@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/mewais/Marsad"
description = "Marsad desktop: a thin Tauri shell — generic rpc/subscribe bridges to the local Marsad daemon (the hub), notifications, tray, single instance"
# Standalone package (built with Tauri's runner or plain cargo), not a workspace member. Local
# development picks up the repository's `.cargo/config.toml` patches for Wasit and Wasl.

[lib]
name = "marsad_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "marsad-desktop"
path = "src/main.rs"

[features]
# Serve the built frontend (`../dist`) instead of the dev server; the Tauri CLI enables it
# for `tauri build`, pass it to plain `cargo build` for a runnable app.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
marsad-client = { path = "../../../crates/marsad-client" }
marsad-proto = { path = "../../../crates/marsad-proto" }
wasit-control = { git = "https://github.com/mewais/Wasit", branch = "session-flows" }
wasit-process = { git = "https://github.com/mewais/Wasit", branch = "session-flows" }
tokio = { version = "1", features = ["sync", "time", "macros", "fs", "io-util", "rt"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

# The window's translucent backdrop (`desktop.window_surface`); both are already in Tauri's tree.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
window-vibrancy = "0.8"
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
gtk = "0.18"

[workspace]
# Empty table: detaches this package from the parent workspace.

[profile.release]
lto = true
strip = true
