[package]
name = "marsad-desktop"
version = "0.1.0"
edition = "2021"
authors = ["Mohammad Ewais <mohammad.a.ewais@gmail.com>"]
license = "MIT"
repository = "https://github.com/mewais/Marsad"
description = "Marsad desktop (Tauri) — Rust bridge over marsad-core"
# Standalone package: builds with Tauri's own runner, not part of the cargo workspace.

[lib]
name = "marsad_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
marsad-core = { path = "../../../crates/marsad-core" }
marsad-viewmodel = { path = "../../../crates/marsad-viewmodel" }
marsad-gates = { path = "../../../crates/marsad-gates" }
marsad-events = { path = "../../../crates/marsad-events" }
marsad-hosts = { path = "../../../crates/marsad-hosts" }
marsad-diff = { path = "../../../crates/marsad-diff" }
marsad-transport = { path = "../../../crates/marsad-transport" }

[workspace]
# Empty table: detaches this package from the parent workspace so `cargo tauri`
# builds it independently with the Tauri profile.
