<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marsad Design Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: slim review bar on top; below it a framed desktop app window (rail + main + status bar) that fills the viewport.
   Dark-first: dark values on bare :root, light under prefers-color-scheme / data-theme. */
:root{
  color-scheme: dark;
  --bg:#0c0f14; --win:#10141a; --surface:#141920; --surface-2:#191f28; --raised:#1f2632; --sunken:#0b0e12;
  --line:#242b37; --line-2:#323b4a;
  --fg:#e7ebf1; --fg-2:#a2acbb; --fg-3:#7d8798;
  --accent:#86a3ff; --accent-strong:#6f8ff7; --accent-fg:#0b1020; --accent-bg:rgba(134,163,255,.13);
  --on-needs:#1d1404;
  --needs:#f2ae45; --needs-bg:rgba(242,174,69,.13); --needs-line:rgba(242,174,69,.45);
  --failed:#f2695c; --failed-bg:rgba(242,105,92,.13); --failed-line:rgba(242,105,92,.45);
  --done:#52c992; --done-bg:rgba(82,201,146,.12); --done-line:rgba(82,201,146,.4);
  --working:#4cc0e4; --working-bg:rgba(76,192,228,.12); --working-line:rgba(76,192,228,.4);
  --idle:#8f98a8; --idle-bg:rgba(143,152,168,.12);
  --d-cc:#e0957a; --d-cx:#62c2b6; --d-oc:#ae98f5; --d-kc:#e38cc1;
  --add:#52c992; --add-bg:rgba(82,201,146,.10); --del:#f2695c; --del-bg:rgba(242,105,92,.10);
  --scrim:rgba(5,7,10,.62);
  --shadow:0 18px 50px rgba(0,0,0,.55); --shadow-sm:0 2px 10px rgba(0,0,0,.35);
  --grid:rgba(160,175,200,.05);
  --f-ui:'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --rb-h:48px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r1:4px; --r2:6px; --r3:10px;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme: light;
  --bg:#e7eaf0; --win:#f6f7fa; --surface:#ffffff; --surface-2:#f4f6f9; --raised:#ffffff; --sunken:#eef1f5;
  --line:#e0e4eb; --line-2:#c9d0db;
  --fg:#141a24; --fg-2:#4a5466; --fg-3:#5f6a7c;
  --accent:#3b5bdb; --accent-strong:#2f4fcf; --accent-fg:#ffffff; --accent-bg:rgba(59,91,219,.09);
  --on-needs:#ffffff;
  --needs:#9a5b00; --needs-bg:rgba(214,140,20,.13); --needs-line:rgba(170,105,0,.45);
  --failed:#c2321f; --failed-bg:rgba(210,60,40,.09); --failed-line:rgba(194,50,31,.4);
  --done:#147a4d; --done-bg:rgba(30,150,95,.10); --done-line:rgba(20,122,77,.35);
  --working:#0a6f93; --working-bg:rgba(15,130,170,.10); --working-line:rgba(10,111,147,.35);
  --idle:#5d6676; --idle-bg:rgba(93,102,118,.10);
  --d-cc:#b4532f; --d-cx:#167a6e; --d-oc:#6a4fd0; --d-kc:#b1407f;
  --add:#147a4d; --add-bg:rgba(30,150,95,.09); --del:#c2321f; --del-bg:rgba(210,60,40,.08);
  --scrim:rgba(20,26,36,.38);
  --shadow:0 18px 50px rgba(20,30,50,.18); --shadow-sm:0 2px 10px rgba(20,30,50,.08);
  --grid:rgba(40,60,100,.05);
}}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#e7eaf0; --win:#f6f7fa; --surface:#ffffff; --surface-2:#f4f6f9; --raised:#ffffff; --sunken:#eef1f5;
  --line:#e0e4eb; --line-2:#c9d0db;
  --fg:#141a24; --fg-2:#4a5466; --fg-3:#5f6a7c;
  --accent:#3b5bdb; --accent-strong:#2f4fcf; --accent-fg:#ffffff; --accent-bg:rgba(59,91,219,.09);
  --on-needs:#ffffff;
  --needs:#9a5b00; --needs-bg:rgba(214,140,20,.13); --needs-line:rgba(170,105,0,.45);
  --failed:#c2321f; --failed-bg:rgba(210,60,40,.09); --failed-line:rgba(194,50,31,.4);
  --done:#147a4d; --done-bg:rgba(30,150,95,.10); --done-line:rgba(20,122,77,.35);
  --working:#0a6f93; --working-bg:rgba(15,130,170,.10); --working-line:rgba(10,111,147,.35);
  --idle:#5d6676; --idle-bg:rgba(93,102,118,.10);
  --d-cc:#b4532f; --d-cx:#167a6e; --d-oc:#6a4fd0; --d-kc:#b1407f;
  --add:#147a4d; --add-bg:rgba(30,150,95,.09); --del:#c2321f; --del-bg:rgba(210,60,40,.08);
  --scrim:rgba(20,26,36,.38);
  --shadow:0 18px 50px rgba(20,30,50,.18); --shadow-sm:0 2px 10px rgba(20,30,50,.08);
  --grid:rgba(40,60,100,.05);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{display:flex;flex-direction:column;margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.i.sm{width:14px;height:14px;vertical-align:-2px} .i.xs{width:12px;height:12px;vertical-align:-2px} .i.lg{width:20px;height:20px}
@media (prefers-reduced-motion: no-preference){ .spin{animation:spin 1.4s linear infinite;transform-origin:50% 50%} @keyframes spin{to{transform:rotate(360deg)}} }

/* ---------- Review bar ---------- */
.review{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;min-height:var(--rb-h);display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
.rb-title{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.rb-title small{font-weight:500;color:var(--fg-3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.rb-group{display:flex;align-items:center;gap:6px}
.rb-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r2);padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:4px;color:var(--fg-2);font-size:12px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg);box-shadow:var(--shadow-sm)}
.seg button:hover{color:var(--fg)}
.rb-caption{flex:1 1 260px;min-width:0;color:var(--fg-2);font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rb-screens .short{display:none}
@media (max-width:1300px){ .rb-caption{display:none} }
@media (max-width:1200px){ .rb-screens .short{display:inline} .rb-screens .long,.review .long,.rb-label,.rb-title small{display:none} .review{gap:8px 10px;flex-wrap:wrap} .rb-group{flex-wrap:wrap} .seg{flex-wrap:wrap} }
.rb-screens button .n{font-family:var(--f-mono);font-size:10px;color:var(--fg-3);margin-right:4px}

/* ---------- Stage + app window ---------- */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto}
.win{position:relative;min-width:992px;flex:1;min-height:640px;background:var(--win);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);
  display:grid;grid-template-rows:40px 1fr 26px;overflow:hidden}
@media (max-width:1100px){ .stage{padding-block:0;padding-left:0;padding-right:0} .win{border-radius:0;border-left:0;border-right:0} }
.titlebar{position:relative;z-index:25;display:flex;align-items:center;gap:var(--s3);padding:0 6px 0 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.01em;min-width:150px}
.brand .ar{font-weight:500;color:var(--fg-3);font-size:12px}
.cmdk{flex:0 1 420px;margin:0 auto;display:flex;align-items:center;gap:8px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r2);background:var(--sunken);color:var(--fg-3);font-size:12px}
.cmdk span{flex:1}
kbd{font-family:var(--f-mono);font-size:10.5px;padding:1px 5px;border-radius:4px;border:1px solid var(--line-2);border-bottom-width:2px;color:var(--fg-2);background:var(--surface-2);white-space:nowrap}
.tb-right{display:flex;align-items:center;gap:6px}
.winctl{display:flex;margin-left:6px}
.winctl span{width:36px;height:28px;display:grid;place-items:center;color:var(--fg-3)}
.body{display:grid;grid-template-columns:78px 1fr;min-height:0}
.rail{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:stretch;padding:8px 6px;gap:2px}
.rail a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:var(--r2);color:var(--fg-2);font-size:10.5px;font-weight:500;text-decoration:none;position:relative;cursor:pointer}
.rail a:hover{background:var(--surface-2);color:var(--fg)}
.rail a[aria-current="true"]{background:var(--accent-bg);color:var(--accent)}
.rail .badge{position:absolute;top:3px;right:8px;min-width:16px;height:16px;border-radius:8px;background:var(--needs);color:var(--on-needs);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.rail .sp{flex:1}
.main{min-width:0;min-height:0;overflow:hidden;position:relative;display:flex;flex-direction:column}
.statusbar{display:flex;align-items:center;gap:var(--s4);padding:0 12px;border-top:1px solid var(--line);background:var(--surface);font-size:11.5px;color:var(--fg-2);white-space:nowrap;overflow:hidden}
.statusbar .sb-item{display:flex;align-items:center;gap:5px}
.statusbar .sp{flex:1}

/* ---------- Buttons, chips, pills ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r2);border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--fg-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-strong)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg-2)} .btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn.allow{background:var(--done-bg);border-color:var(--done-line);color:var(--done)}
.btn.always{background:transparent;border-color:var(--line-2);color:var(--fg)}
.btn.deny{background:transparent;border-color:var(--failed-line);color:var(--failed)}
.btn.warn{background:var(--needs);border-color:var(--needs);color:var(--on-needs)}
.btn kbd{border-color:currentColor;background:transparent;color:inherit;opacity:.75;padding:0 4px;font-size:10px}
.iconbtn{width:28px;height:28px;display:inline-grid;place-items:center;border-radius:var(--r2);border:1px solid transparent;background:transparent;color:var(--fg-2);position:relative}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}
.iconbtn .dotn{position:absolute;top:2px;right:2px;min-width:14px;height:14px;border-radius:7px;background:var(--needs);color:var(--on-needs);font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 3px}

.st{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px 0 6px;border-radius:11px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.st.needs{color:var(--needs);background:var(--needs-bg);border-color:var(--needs-line)}
.st.failed{color:var(--failed);background:var(--failed-bg);border-color:var(--failed-line)}
.st.done{color:var(--done);background:var(--done-bg);border-color:var(--done-line)}
.st.working{color:var(--working);background:var(--working-bg);border-color:var(--working-line)}
.st.idle{color:var(--idle);background:var(--idle-bg);border-color:transparent}
/* Ended: the agent's process is gone, the session is kept. Outlined, so it never reads as idle. */
.st.ended{color:var(--fg-3);background:transparent;border-color:var(--line-2)}
.st.plain{background:transparent;border-color:transparent;padding:0;height:auto}
.c-needs{color:var(--needs)} .c-failed{color:var(--failed)} .c-done{color:var(--done)} .c-working{color:var(--working)} .c-idle{color:var(--idle)} .c-ended{color:var(--fg-3)} .c-accent{color:var(--accent)}

.drv{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;color:var(--fg-2)}
.drv b{display:inline-grid;place-items:center;width:20px;height:18px;border-radius:4px;font:600 9.5px/1 var(--f-mono);border:1px solid currentColor;letter-spacing:-.02em}
.drv.cc b{color:var(--d-cc)} .drv.cx b{color:var(--d-cx)} .drv.oc b{color:var(--d-oc)} .drv.kc b{color:var(--d-kc)}
.drv.compact span{display:none}
.host{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:12px;color:var(--fg-2)}
.conn{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;white-space:nowrap}
.conn .pip{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px color-mix(in srgb, currentColor 22%, transparent)}
.conn.ok{color:var(--done)} .conn.warn{color:var(--needs)} .conn.bad{color:var(--failed)} .conn.info{color:var(--working)}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:13px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg-2);font-size:12px;font-weight:500;white-space:nowrap}
.chip:hover{color:var(--fg);border-color:var(--fg-3)}
.chip.on{background:var(--accent-bg);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
.chip .x{opacity:.7}
.tag{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--fg-2);font-size:11px;font-weight:500;white-space:nowrap}
.tag.ws{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-bg)}
.newdot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;display:inline-block}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.h2{font-size:15px;font-weight:600}
.h3{font-size:13px;font-weight:600}
.input{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r2);background:var(--sunken);color:var(--fg-3);font-size:12.5px}
.input input{border:0;background:transparent;outline:0;flex:1;min-width:0;color:var(--fg)}
.input input::placeholder{color:var(--fg-3)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:12px;font-weight:600;color:var(--fg)}
.field .hint{font-size:11.5px;color:var(--fg-3)}
.field .err{font-size:11.5px;color:var(--failed)}
.field.bad .input{border-color:var(--failed-line)}
.selbox{display:flex;align-items:center;justify-content:space-between;gap:8px;height:30px;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r2);background:var(--surface);font-size:12.5px;color:var(--fg)}
.selbox .i{color:var(--fg-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3)}
.scroll{overflow:auto;min-height:0}
.sep{height:1px;background:var(--line)}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:2px}
.bar.w>i{background:var(--working)} .bar.n>i{background:var(--needs)}

/* ---------- Page header ---------- */
.ph{display:flex;align-items:center;gap:var(--s3);padding:14px 20px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph .h1{margin-right:4px}
.ph .summary{display:flex;gap:14px;font-size:12.5px;color:var(--fg-2);flex-wrap:wrap}
.ph .summary b{font-weight:600}
.ph .sp{flex:1}
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar .sp{flex:1}
.keyhints{display:flex;gap:14px;align-items:center;padding:7px 20px;border-top:1px solid var(--line);font-size:11.5px;color:var(--fg-3);flex-wrap:wrap;background:var(--surface)}
.keyhints span{display:inline-flex;gap:5px;align-items:center}

/* ---------- Home A: inbox ---------- */
.ibx{flex:1;min-height:0;overflow:auto}
.ibx-head,.ibx-row{display:grid;grid-template-columns:118px minmax(200px,1.5fr) 118px 140px minmax(170px,1.3fr) 66px 58px;gap:12px;align-items:center;padding:0 20px}
.ibx-head{position:sticky;top:0;z-index:2;height:30px;background:var(--win);border-bottom:1px solid var(--line);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.ibx-head .r,.ibx-row .r{text-align:right}
.grp{display:flex;align-items:center;gap:8px;padding:14px 20px 6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.grp .cnt{font-family:var(--f-mono);font-weight:500;color:var(--fg-3)}
.grp .gline{flex:1;height:1px;background:var(--line)}
.grp .gact{font-size:11.5px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--fg-2)}
.ibx-item{border-bottom:1px solid var(--line);position:relative}
.ibx-row{min-height:46px;padding-block:6px;cursor:pointer}
.ibx-item:hover{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.ibx-item.sel{background:var(--surface);box-shadow:inset 2px 0 0 var(--accent)}
.sn{display:flex;flex-direction:column;min-width:0;gap:1px}
.sn .t{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;min-width:0}
.sn .t .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sn .s{font-size:12px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sn .s.err{color:var(--failed);font-family:var(--f-mono);font-size:11.5px}
.pb{display:flex;flex-direction:column;min-width:0;font-size:12px}
.pb .p{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb .b{color:var(--fg-3);font-family:var(--f-mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cost{font-family:var(--f-mono);font-size:12px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.ago{font-size:12px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.gate-inline{margin:0 20px 10px 150px;padding:10px 12px;border:1px solid var(--needs-line);border-radius:var(--r3);background:var(--needs-bg);display:flex;flex-direction:column;gap:8px}
.gate-inline .gq{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--fg)}
.gate-inline .gq .i{color:var(--needs);margin-top:1px}
.gate-inline code,.code-inline{font-family:var(--f-mono);font-size:12px;background:var(--sunken);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--fg)}
.gate-inline.compact{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 8px 6px 12px}
.gate-inline .gs{flex:1 1 280px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--fg)}
.gate-inline .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gate-inline .acts .sp{flex:1}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--r2);border:1px solid var(--line-2);background:var(--surface);font-size:12px;cursor:pointer}
.opt .k{font-family:var(--f-mono);font-size:10.5px;color:var(--fg-3)}
.opt.on{border-color:var(--accent);background:var(--accent-bg);color:var(--fg)}
.opt .rad{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--fg-3);flex:none}
.opt.on .rad{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 3px,transparent 3.5px)}
.donebox{margin:0 20px 10px 150px;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--fg-2)}
.donebox .stat{font-family:var(--f-mono);font-size:11.5px}
.add{color:var(--add)} .del{color:var(--del)}

/* shared list items (settings nav) */
.lr-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:var(--r2);font-size:12.5px;color:var(--fg-2);cursor:pointer}
.lr-item:hover{background:var(--surface-2);color:var(--fg)}
.lr-item.on{background:var(--accent-bg);color:var(--fg)}

/* ---------- Agent-offered choices ---------- */
.srccap{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--fg-3);white-space:nowrap}
.srccap .drv b{width:18px;height:16px;font-size:9px}
.srccap.wasl{color:var(--accent)}
.choices{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.choices .btn{white-space:normal;height:auto;min-height:24px;padding-block:3px;text-align:left;line-height:1.3}
.choices .btn.lg{min-height:28px;padding-block:5px}
.choices .btn code{font-family:var(--f-mono);font-size:11px;padding:0 4px;border-radius:3px;background:var(--sunken);border:1px solid var(--line);color:var(--fg)}
.tell{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tell .input{flex:1 1 240px;height:28px}
.optother{display:inline-flex;align-items:center;gap:6px}
.optother input{border:0;border-bottom:1px solid var(--line-2);background:transparent;outline:0;font-size:12px;color:var(--fg);width:150px;padding:1px 2px}
.optother input::placeholder{color:var(--fg-3)}

/* ---------- Home C: attention board ---------- */
.attn{flex:1;min-height:0;display:flex;flex-direction:column}
.acols{flex:1;min-height:0;overflow:auto;padding:12px 20px 16px;display:flex;gap:12px;align-items:flex-start}
.acol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:8px}
.acol.wide{flex-grow:1.55}
.acol.empty{flex:0 0 44px;align-self:stretch;border:1px dashed var(--line-2);border-radius:var(--r3);align-items:center;padding:12px 0;gap:10px;color:var(--fg-3)}
.acol.empty .vlab{writing-mode:vertical-rl;font-size:12px;font-weight:600;white-space:nowrap;letter-spacing:.02em}
.acol-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 2px 2px;min-height:26px}
.acol-h .cnt{font-family:var(--f-mono);font-weight:500;color:var(--fg-3)}
.acol-h .sp{flex:1}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.acard.needs{border-color:var(--needs-line)} .acard.failed{border-color:var(--failed-line)}
.acard .t{display:flex;align-items:center;gap:6px;font-weight:600;min-width:0;flex-wrap:wrap}
.acard .t .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.acard .m{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--fg-3);flex-wrap:wrap}
.acard .ask{font-size:12.5px;color:var(--fg);display:flex;gap:8px;align-items:flex-start}
.acard .ask .i{margin-top:1px}
.acard .l{font-size:12px;color:var(--fg-2)}
.acard .l.err{color:var(--failed);font-family:var(--f-mono);font-size:11.5px}
.acard .foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.acard .foot .sp{flex:1}
.acard code{font-family:var(--f-mono);font-size:11.5px;background:var(--sunken);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--fg)}
.acard .cmdb{display:block;margin-top:4px;padding:5px 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.qlist{display:flex;flex-direction:column;gap:4px}
.qlist .qopt{padding:5px 8px;font-size:12px;gap:8px;align-items:center}
.qlist .qopt .rad{margin-top:0}
.quiet{border-top:1px solid var(--line);background:var(--surface)}
.quiet-h{display:flex;align-items:center;gap:10px;padding:7px 20px;font-size:12.5px;color:var(--fg-2);flex-wrap:wrap}
.quiet-h b{color:var(--fg);font-weight:600}
.quiet-h .sp{flex:1}
.qrows{max-height:232px;overflow:auto;border-top:1px solid var(--line)}
.qrow{display:grid;grid-template-columns:18px minmax(150px,1.1fr) 26px 128px minmax(180px,2fr) 44px 52px;gap:10px;align-items:center;padding:5px 20px;font-size:12px;border-bottom:1px solid var(--line);cursor:pointer}
.qrow:hover{background:var(--surface-2)}
.qrow .nm{font-weight:600;display:flex;gap:6px;align-items:center;min-width:0}
.qrow .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .ln{color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Workstreams list ---------- */
.wsl{flex:1;min-height:0;overflow:auto;padding:12px 20px 18px;display:flex;flex-direction:column;gap:8px}
.wsh,.wsrow{display:grid;grid-template-columns:minmax(220px,1.7fr) minmax(150px,1fr) 70px minmax(170px,1.2fr) 64px 92px 18px;gap:14px;align-items:center}
.wsh{padding:0 14px 2px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.wsrow{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r3);background:var(--surface);cursor:pointer}
.wsrow:hover{border-color:var(--line-2)}
.wsrow .nm{display:flex;flex-direction:column;gap:2px;min-width:0}
.wsrow .nm b{font-size:13.5px;display:flex;gap:8px;align-items:center}
.wsrow .nm span{font-size:12px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsrow .hm{display:flex;flex-direction:column;gap:2px}
.wsrow .sw{font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.wsrow .r{text-align:right}
.tpl{display:flex;gap:10px;flex-wrap:wrap}
.tpl .card{padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:220px;flex:1 1 220px}
.startopts{display:flex;flex-direction:column;gap:6px}
.startopts .pol label{align-items:flex-start}

/* ---------- Session detail ---------- */
.sd-head{padding:12px 20px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--win)}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-3)}
.crumbs a{color:var(--fg-2);text-decoration:none;cursor:pointer} .crumbs a:hover{color:var(--fg)}
.sd-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sd-meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--fg-2)}
.sd-meta .kv{display:inline-flex;align-items:center;gap:6px}
.ctx{display:inline-flex;align-items:center;gap:6px}
.ctx .bar{width:64px}
.tabs{display:flex;gap:2px;margin-top:2px}
.tabs button{border:0;background:transparent;padding:8px 12px;font-size:12.5px;font-weight:500;color:var(--fg-2);border-bottom:2px solid transparent;display:inline-flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs .n{font-family:var(--f-mono);font-size:10.5px;padding:0 5px;border-radius:8px;background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line)}
.sd-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 268px}
.sd-body.full{grid-template-columns:1fr}
.tr-wrap{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.transcript{flex:1;overflow:auto;padding:16px 24px 8px}
.tr{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.msg-user{align-self:flex-end;max-width:78%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px 10px 2px 10px;padding:9px 12px;font-size:13px}
.msg-ai{font-size:13.5px;line-height:1.55;color:var(--fg)}
.msg-ai p{margin:0 0 6px}
.who{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg-3);margin-bottom:4px}
.think{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-3);cursor:pointer;width:max-content}
.think:hover{color:var(--fg-2)}
.tool{border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);overflow:hidden}
.tool-h{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px;cursor:pointer}
.tool-h .nm{font-weight:600}
.tool-h .arg{font-family:var(--f-mono);font-size:11.5px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.tool-h .res{font-size:11.5px;color:var(--fg-3);white-space:nowrap}
.tool-b{border-top:1px solid var(--line);background:var(--sunken);padding:8px 10px;font-family:var(--f-mono);font-size:11.5px;color:var(--fg-2);white-space:pre;overflow:auto;line-height:1.55}
/* Run of consecutive tool calls: one .tool row (same look), "N tool calls" + the latest call; open, it lists the calls (.run-b) as ordinary .tool rows. Images and files the calls produced stay visible under the collapsed row. */
.tool.run .nm{font-variant-numeric:tabular-nums}
.run-b{border-top:1px solid var(--line);background:var(--sunken);padding:8px;display:flex;flex-direction:column;gap:8px}
/* A message that did not reach the agent: dashed failed-coloured outline, a line under the text saying why. Queued: dimmed text, "Queued" under it. Sent: nothing. */
.msg-user[data-delivery="not_sent"]{border-style:dashed;border-color:var(--failed-line)}
.msg-user[data-delivery="not_sent"] .md,.msg-user[data-delivery="queued"] .md{opacity:.75}
.msg-state{margin-top:4px;font-size:12px}
.diff{font-family:var(--f-mono);font-size:11.5px;line-height:1.6;background:var(--sunken);overflow:auto}
.diff .ln{display:grid;grid-template-columns:38px 38px 16px 1fr;white-space:pre}
.diff .ln span:nth-child(-n+2){color:var(--fg-3);text-align:right;padding-right:8px;user-select:none}
.diff .ln.a{background:var(--add-bg)} .diff .ln.a span:nth-child(3){color:var(--add)}
.diff .ln.d{background:var(--del-bg)} .diff .ln.d span:nth-child(3){color:var(--del)}
.diff .hunk{color:var(--fg-3);padding:2px 10px;background:var(--surface-2);white-space:pre}
.subag{border:1px solid var(--line);border-left:3px solid var(--d-oc);border-radius:var(--r2);background:var(--surface);padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.subag-h{display:flex;align-items:center;gap:8px;font-size:12px}
.subag ul{margin:0;padding-left:18px;font-size:12px;color:var(--fg-2)}
.subbar{display:flex;align-items:center;gap:8px;padding:8px 24px;border-bottom:1px solid var(--line);font-size:12px;background:var(--win);min-width:0}
.subbar .back{transform:rotate(90deg)}
.subfoot{display:flex;align-items:center;gap:6px;padding:8px 24px 12px;border-top:1px solid var(--line);background:var(--win);font-size:12px;color:var(--fg-3)}
.subag[data-running]{border-left-color:var(--working)}
.subag-h{flex-wrap:wrap}
.hist.work{gap:2px}
.wk{display:flex;flex-direction:column;gap:2px;padding:6px 0;border-bottom:1px solid var(--line)}
.wk-main{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;font-size:12px;color:var(--fg);text-decoration:none;border-radius:var(--r2)}
a.wk-main:hover{background:var(--surface-2)} a.wk-main[aria-current="page"]{background:var(--accent-bg)}
.wk-main .w{font-size:11px;color:var(--fg-3);white-space:nowrap}
.wk-meta{display:flex;align-items:center;gap:8px;font-size:11px;padding-left:24px;min-height:24px;color:var(--fg-3)}
.gate{border:1px solid var(--needs-line);background:var(--needs-bg);border-radius:var(--r3);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.gate-h{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--needs);font-size:12.5px}
.gate-h .sp{flex:1}
.gate .cmd{font-family:var(--f-mono);font-size:12.5px;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r2);padding:8px 10px;color:var(--fg);overflow:auto;white-space:pre}
.gate .risk{display:flex;gap:8px;font-size:12px;color:var(--fg)}
.gate .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gate .acts .sp{flex:1}
.gate .q{font-size:13.5px;color:var(--fg);font-weight:500}
.qopts{display:flex;flex-direction:column;gap:6px}
.qopt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r2);background:var(--surface);cursor:pointer}
.qopt .rad{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--fg-3);flex:none;margin-top:2px}
.qopt.on{border-color:var(--accent);background:var(--accent-bg)}
.qopt.on .rad{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 3.5px,transparent 4px)}
.qopt .d{font-size:12px;color:var(--fg-2)}
.qopt .k{margin-left:auto}
.composer-wrap{padding:8px 24px 14px;position:relative}
.composer{max-width:820px;margin:0 auto;border:1px solid var(--line-2);border-radius:var(--r3);background:var(--surface);box-shadow:var(--shadow-sm);position:relative}
.composer textarea{width:100%;border:0;background:transparent;resize:none;outline:0;padding:10px 12px 4px;font-size:13px;color:var(--fg);height:44px}
.composer textarea::placeholder{color:var(--fg-3)}
.comp-bar{display:flex;align-items:center;gap:6px;padding:4px 6px 6px}
.comp-bar .sp{flex:1}
.pick{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:var(--r2);border:1px solid var(--line);background:var(--surface-2);font-size:11.5px;color:var(--fg-2);white-space:nowrap}
.pick:hover{color:var(--fg)}
.slash{position:absolute;left:0;bottom:calc(100% + 6px);width:420px;background:var(--raised);border:1px solid var(--line-2);border-radius:var(--r3);box-shadow:var(--shadow);padding:6px;z-index:5}
.slash .it{display:grid;grid-template-columns:118px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:var(--r2);font-size:12px}
.slash .it.on{background:var(--accent-bg)}
.slash .it b{font-family:var(--f-mono);font-weight:500;color:var(--fg);white-space:nowrap}
.slash .it span{color:var(--fg-2)}
.slash .src{font-size:10.5px;color:var(--fg-3)}
.side{border-left:1px solid var(--line);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:16px;background:var(--surface)}
.side h4{margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.todo{display:flex;flex-direction:column;gap:6px;font-size:12px}
.todo div{display:flex;gap:8px;align-items:flex-start}
.todo .dn{color:var(--fg-3);text-decoration:line-through}
.kvl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12px}
.kvl dt{color:var(--fg-3)} .kvl dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.jump{display:flex;flex-direction:column;gap:6px}
.jump a{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:var(--r2);border:1px solid var(--needs-line);background:var(--needs-bg);font-size:12px;color:var(--fg);text-decoration:none;cursor:pointer}
/* changes tab */
.chg{display:grid;grid-template-columns:300px 1fr;flex:1;min-height:0}
.flist{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.frow{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12px;cursor:pointer}
.frow:hover{background:var(--surface)}
.frow.on{background:var(--surface);box-shadow:inset 2px 0 0 var(--accent)}
.frow .fn{font-family:var(--f-mono);font-size:11.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.frow .ms{font-family:var(--f-mono);font-size:10.5px;width:14px;text-align:center;font-weight:600}
.commit{margin-top:auto;border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.ta{border:1px solid var(--line-2);border-radius:var(--r2);background:var(--sunken);padding:8px 10px;font-size:12.5px;color:var(--fg);min-height:64px;line-height:1.45}
.term{flex:1;margin:12px 20px 16px;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r3);padding:12px 14px;font-family:var(--f-mono);font-size:12px;line-height:1.6;color:var(--fg-2);overflow:auto;white-space:pre}
.termwrap{flex:1;margin:12px 20px 16px;display:flex;flex-direction:column;min-height:0;gap:6px}
.termwrap .term{margin:0;flex:1}
.term-status{font-size:12px;display:flex;align-items:center;gap:8px;min-height:28px;color:var(--fg-3)} .term-status .sp{flex:1} .term-status .mono{font-family:var(--f-mono)}
.termvar{display:flex;align-items:center;gap:8px;margin:12px 20px 0;font-size:11.5px;color:var(--fg-3)}
.term .p{color:var(--accent)} .term .ok{color:var(--done)} .term .er{color:var(--failed)} .term .w{color:var(--needs)}
.cfgcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;padding:16px 20px;overflow:auto;align-content:start}
.cfgcols .card{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .k{font-size:11.5px;color:var(--fg-3)}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- Graph ---------- */
.gx{display:grid;grid-template-columns:1fr 340px;flex:1;min-height:0}
.gx>*{min-height:0;min-width:0}
.canvas-wrap{position:relative;overflow:auto;background-color:var(--win);background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:16px 16px}
.canvas{position:relative;width:1000px;height:600px;margin:0 auto}
.lanebg{position:absolute;left:12px;right:12px;border:1px solid var(--line);border-radius:var(--r3);background:color-mix(in srgb,var(--surface) 55%,transparent)}
.lanelab{position:absolute;left:12px;top:10px;display:flex;flex-direction:column;gap:3px;width:150px}
.lanelab .hn{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px;color:var(--fg)}
.lanelab .hm{font-size:11px;color:var(--fg-3)}
.gsvg{position:absolute;inset:0;overflow:visible}
.gsvg path{fill:none;stroke-width:1.8}
.gn{position:absolute;width:230px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r3);padding:9px 11px;display:flex;flex-direction:column;gap:6px;cursor:pointer;box-shadow:var(--shadow-sm)}
.gn:hover{border-color:var(--fg-3)}
.gn.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.gn .t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.gn .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gn .row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--fg-2)}
.gn .row .sp{flex:1}
.gn .task{font-size:11.5px;color:var(--fg-2);display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:6px}
.gn.orch{border-color:color-mix(in srgb,var(--accent) 55%,var(--line-2))}
.el{position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:12px;border:1px solid var(--line-2);background:var(--raised);font-size:11px;font-weight:600;white-space:nowrap;cursor:pointer;box-shadow:var(--shadow-sm)}
.el.ask{color:var(--needs);border-color:var(--needs-line)}
.el.allow{color:var(--done);border-color:var(--done-line)}
.el.block{color:var(--failed);border-color:var(--failed-line)}
.el.sel{box-shadow:0 0 0 3px var(--accent-bg);border-color:var(--accent)}
.el .tk{color:var(--fg-2);font-weight:500;display:inline-flex;align-items:center;gap:5px}
.el .tk .bar{width:34px;display:inline-block}
.el.pending{background:var(--needs);color:var(--on-needs);border-color:var(--needs)}
.gbanner{position:sticky;top:12px;left:0;margin:12px auto 0;width:max-content;z-index:3;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border-radius:var(--r3);border:1px solid var(--needs-line);background:var(--raised);box-shadow:var(--shadow);font-size:12.5px;white-space:nowrap}
.gctl{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;z-index:3}
.glegend{position:absolute;left:12px;bottom:12px;z-index:3;display:flex;gap:14px;padding:6px 10px;border-radius:var(--r2);background:var(--raised);border:1px solid var(--line);font-size:11px;color:var(--fg-2)}
.glegend span{display:inline-flex;align-items:center;gap:6px}
.insp{border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.insp .sec{display:flex;flex-direction:column;gap:8px}
.pol{display:flex;flex-direction:column;gap:6px}
.pol label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:var(--r2);border:1px solid var(--line-2);cursor:pointer;font-size:12px}
.pol label.on{border-color:var(--accent);background:var(--accent-bg)}
.pol label b{display:block;font-size:12.5px}
.pol label .drv b{display:inline-grid;font-size:9.5px}
.pol .d{color:var(--fg-2);font-size:11.5px}
.hist{display:flex;flex-direction:column}
.hist .h{display:grid;grid-template-columns:16px 1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px;align-items:start}
.hist .h .w{font-size:11px;color:var(--fg-3);white-space:nowrap}
.hist .h .d{font-size:11.5px;color:var(--fg-2)}
.hostline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2)}

/* ---------- Modal / dialogs ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.scrim.left{justify-content:flex-start;padding-left:40px;padding-right:400px}
.scrim.left .dlg{width:min(820px,100%)}
.dlg{background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:100%;width:min(920px,100%);min-height:0}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h .sp{flex:1}
.dlg-b{padding:14px 18px;overflow:auto;min-height:0}
.dlg-f{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.dlg-f .sp{flex:1}
.ns{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ns .col{display:flex;flex-direction:column;gap:12px;min-width:0}
.drvpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dp{border:1px solid var(--line-2);border-radius:var(--r2);padding:8px;display:flex;flex-direction:column;gap:4px;cursor:pointer;background:var(--surface)}
.dp.on{border-color:var(--accent);background:var(--accent-bg)}
.dp .v{font-size:11px;color:var(--fg-3);font-family:var(--f-mono)}
.dp .drv{color:var(--fg);font-weight:600}
.hostpick{display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:var(--r2);overflow:hidden}
.hp{display:flex;align-items:center;gap:10px;padding:7px 10px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--line)}
.hp:last-child{border-bottom:0}
.hp.on{background:var(--accent-bg)}
.hp .sp{flex:1}
.hp.dis{opacity:.62;cursor:not-allowed}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rlist{border:1px solid var(--line-2);border-radius:var(--r2);overflow:hidden;display:flex;flex-direction:column}
.rlist .rs{padding:6px 10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:14px 1fr auto;gap:2px 8px;cursor:pointer;font-size:12px}
.rlist .rs:last-child{border-bottom:0}
.rlist .rs.on{background:var(--accent-bg)}
.rlist .rs .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist .rs .d{grid-column:2/4;color:var(--fg-3);font-size:11px;font-family:var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px dashed var(--line-2);border-radius:var(--r2);font-size:12px;color:var(--fg-2)}

/* ---------- Agent config ---------- */
.ac{display:grid;grid-template-columns:372px 1fr;flex:1;min-height:0}
.ac>*{min-height:0;min-width:0}
.stack{border-right:1px solid var(--line);overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:0;background:var(--surface)}
.layer{border:1px solid var(--line-2);border-radius:var(--r3);padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--win);cursor:pointer}
.layer.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.layer .lh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px}
.layer .lh .lv{font-family:var(--f-mono);font-size:10.5px;color:var(--fg-3);font-weight:500}
.layer .lh .sp{flex:1}
.layer .dl{font-size:11.5px;display:flex;gap:6px;align-items:center;color:var(--fg-2)}
.layer .dl .op{font-family:var(--f-mono);width:12px;text-align:center;font-weight:700}
.arrowdown{display:flex;justify-content:center;color:var(--fg-3);padding:3px 0}
.eff{display:flex;flex-direction:column;min-height:0}
.eff-h{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.eff-b{overflow:auto;flex:1;padding:4px 20px 16px}
.etab{width:100%;border-collapse:collapse;font-size:12px}
.etab th{position:sticky;top:0;background:var(--win);text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);padding:10px 8px 8px;border-bottom:1px solid var(--line);z-index:1}
.etab td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.etab .cat td{padding:14px 8px 6px;font-size:12px;font-weight:700;border-bottom:1px solid var(--line-2);color:var(--fg)}
.etab .nm{font-weight:600;display:flex;align-items:center;gap:8px}
.etab .ds{font-size:11.5px;color:var(--fg-3)}
.etab tr.off td:not(.keep){opacity:.55}
.etab .c{text-align:center;width:44px}
.prov{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:10px;font-size:11px;font-weight:500;white-space:nowrap;border:1px solid var(--line-2);color:var(--fg-2);background:var(--surface)}
.prov.g{} .prov.h{color:var(--working);border-color:var(--working-line)} .prov.w{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)} .prov.s{color:var(--d-oc);border-color:color-mix(in srgb,var(--d-oc) 45%,transparent)}
.prov.x{color:var(--failed);border-color:var(--failed-line)}
.sup{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px}
.sup.y{color:var(--done)} .sup.p{color:var(--needs)} .sup.n{color:var(--fg-3);background:var(--surface-2)}
.reason{font-size:11px;color:var(--fg-3);margin-top:2px}
/* ---------- Hosts ---------- */
.hs{display:grid;grid-template-columns:minmax(480px,1fr) 400px;flex:1;min-height:0}
.hs>*{min-height:0;min-width:0}
.hlist{overflow:auto;padding:12px 20px}
.hrow{display:grid;grid-template-columns:26px minmax(150px,1.2fr) minmax(150px,1fr) 70px minmax(140px,1fr);gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r3);margin-bottom:8px;background:var(--surface);cursor:pointer}
.hrow.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.hrow .hn{font-weight:600;display:flex;flex-direction:column;gap:1px}
.hrow .hn small{font-weight:400;color:var(--fg-3);font-size:11.5px}
.clis{display:flex;gap:4px;flex-wrap:wrap}
.hd{border-left:1px solid var(--line);overflow:auto;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:16px}
.steps{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--fg-3)}
.steps .s{display:inline-flex;align-items:center;gap:6px}
.steps .s b{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line-2);font-size:11px}
.steps .s.on{color:var(--fg)} .steps .s.on b{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.steps .s.dn b{background:var(--done-bg);border-color:var(--done-line);color:var(--done)}
.check{display:flex;flex-direction:column;gap:6px;font-size:12px}
.check div{display:flex;gap:8px;align-items:center}

/* ---------- Gate overlay ---------- */
.gov{width:min(860px,100%)}
.gtabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line)}
.gtabs button{border:0;background:transparent;padding:9px 10px;font-size:12.5px;font-weight:500;color:var(--fg-2);border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px}
.gtabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--needs)}
.riskbox{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;padding:12px 14px;border-radius:var(--r3);border:1px solid var(--needs-line);background:var(--needs-bg);font-size:12.5px}
.riskbox .lvl{font-weight:700;color:var(--needs);display:flex;align-items:center;gap:6px}
.riskbox ul{margin:0;padding-left:16px;color:var(--fg);display:flex;flex-direction:column;gap:3px}
.scope{display:flex;flex-direction:column;gap:6px}
.ctxline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--fg-2)}
.plan ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.plan ol li span{display:block;font-size:12px;color:var(--fg-2)}
.hop{display:grid;grid-template-columns:1fr 60px 1fr;align-items:center;gap:8px}
.hop .end{border:1px solid var(--line-2);border-radius:var(--r3);padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--win)}
.payload{border:1px solid var(--line);border-radius:var(--r3);background:var(--sunken);padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.toasts{position:absolute;right:14px;bottom:14px;z-index:30;display:flex;flex-direction:column;gap:8px;width:360px}
.toast{display:grid;grid-template-columns:20px 1fr auto;gap:4px 10px;padding:10px 12px;border-radius:var(--r3);background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:12.5px}
.toast .t{font-weight:600}
.toast .d{grid-column:2/3;font-size:12px;color:var(--fg-2)}
.toast .a{grid-column:2/4;display:flex;gap:6px;margin-top:4px}
.toast.err{border-color:var(--failed-line);box-shadow:inset 3px 0 0 var(--failed),var(--shadow)}
.toast.warn{border-color:var(--needs-line);box-shadow:inset 3px 0 0 var(--needs),var(--shadow)}
.toast.ok{box-shadow:inset 3px 0 0 var(--done),var(--shadow)}
/* settings */
.set{display:grid;grid-template-columns:200px 1fr;flex:1;min-height:0}
.set>*{min-height:0;min-width:0}
.setnav{border-right:1px solid var(--line);padding:14px 8px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.setbody{overflow:auto;padding:18px 24px;display:flex;flex-direction:column;gap:18px}
.nt th.c,.nt td.c{text-align:center;width:110px}
.tg{width:30px;height:18px;border-radius:9px;background:var(--line-2);position:relative;display:inline-block;vertical-align:middle;border:0}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--fg-2);transition:left .15s}
.tg.on{background:var(--accent)} .tg.on::after{left:14px;background:var(--accent-fg)}
.cb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--fg-3);display:inline-grid;place-items:center;vertical-align:middle;color:var(--accent-fg)}
.cb.on{background:var(--accent);border-color:var(--accent)}
.sample{display:flex;gap:10px;flex-wrap:wrap}


/* ---------- Split button ---------- */
.split{position:relative;display:inline-flex}
.split>.btn:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.split>.btn.caret{border-top-left-radius:0;border-bottom-left-radius:0;padding:0 6px;border-left-color:color-mix(in srgb,var(--accent-fg) 35%,var(--accent))}
.menu{position:absolute;right:0;top:calc(100% + 6px);width:290px;background:var(--raised);border:1px solid var(--line-2);border-radius:var(--r3);box-shadow:var(--shadow);padding:4px;z-index:45;display:flex;flex-direction:column}
.menu button{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:transparent;padding:8px;border-radius:var(--r2);font-size:12.5px;font-weight:600;color:var(--fg)}
.menu button:hover,.menu button.on{background:var(--accent-bg)}
.menu small{display:block;color:var(--fg-3);font-size:11.5px;font-weight:400}

/* ---------- Gate overlay caption ---------- */
.gcap{display:flex;gap:10px;align-items:flex-start;padding:9px 18px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:12px;color:var(--fg-2);line-height:1.45}
.gcap .i{margin-top:1px;color:var(--fg-3)}
.gcap b{color:var(--fg);font-weight:600}
.gcap .hl{background:var(--accent-bg);color:var(--fg);border-radius:3px;padding:0 3px}
.drvswitch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--fg-3)}

/* ---------- Workstream design mode ---------- */
.gn.design{cursor:grab;width:256px}
.gn .wasl{display:inline-flex;gap:4px;align-items:center;white-space:nowrap;font-size:11px;color:var(--accent)}
.gn .port{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.gn .port.on{background:var(--accent)}
.gn .meta{font-size:11.5px;color:var(--fg-2);display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--line);padding-top:6px}
.slot{position:absolute;border:1.5px dashed var(--line-2);border-radius:var(--r3);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--fg-2);font-size:12px;font-weight:500;background:color-mix(in srgb,var(--surface) 40%,transparent);cursor:pointer}
.slot:hover{border-color:var(--fg-3);color:var(--fg)}
.slot.hot{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.draghint{position:absolute;display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:var(--r2);background:var(--raised);border:1px solid color-mix(in srgb,var(--accent) 50%,var(--line-2));box-shadow:var(--shadow-sm);font-size:11.5px;color:var(--fg);width:226px;line-height:1.4}
.draghint .i{color:var(--accent);margin-top:1px}
.lanebg.off{opacity:.6;background:repeating-linear-gradient(135deg,transparent 0 8px,var(--grid) 8px 16px)}
.lanenote{position:absolute;left:190px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--fg-2);display:flex;gap:6px;align-items:center}
.cl{display:flex;flex-direction:column;gap:8px}
.cl .ci{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:12.5px;align-items:start}
.cl .ci .d{font-size:11.5px;color:var(--fg-2);margin-top:1px}
.summ{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border-radius:var(--r2);background:var(--accent-bg);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);font-size:12.5px;font-weight:600}
.insp-foot{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);margin:auto -16px -16px;padding:12px 16px;position:sticky;bottom:-16px;background:var(--surface)}
.st.draft{color:var(--accent);background:var(--accent-bg);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}

/* ---------- New session: resumable list ---------- */
.recent.owned{align-items:flex-start}
.recent.owned .tx{white-space:normal;line-height:1.45}
.sd-ended{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2)}
.own{display:flex;flex-direction:column;gap:6px;font-size:12px}
.own p{margin:0;line-height:1.45}
.own-row{display:flex;align-items:flex-start;gap:6px}
.own-row code{flex:1;min-width:0;padding:4px 6px;border-radius:6px;background:var(--sunken);border:1px solid var(--line);font:11.5px var(--f-mono);overflow-wrap:anywhere}
.recent{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r2);background:var(--surface-2);font-size:12px}
.recent .tx{flex:1;min-width:0}
.recent .tx div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slist{border:1px solid var(--line-2);border-radius:var(--r2);overflow:auto;max-height:226px}
.slist .sh,.slist .sr{display:grid;grid-template-columns:14px minmax(0,1fr) 88px 64px 38px;gap:8px;align-items:center;padding:6px 10px}
.slist .sh{position:sticky;top:0;z-index:1;background:var(--surface-2);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);border-bottom:1px solid var(--line)}
.slist .sr{border-bottom:1px solid var(--line);cursor:pointer;font-size:12px}
.slist .sr:last-child{border-bottom:0}
.slist .sr:hover{background:var(--surface-2)}
.slist .sr.on{background:var(--accent-bg)}
.slist .tt{display:flex;flex-direction:column;min-width:0}
.slist .tt b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slist .tt span{font-size:11px;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slist .r{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg-2)}
.tag.trm{color:var(--fg-2)}
.disc{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--fg-3)}

/* ---------- Agent config (mirror + overrides) ---------- */
.layer.base{background:var(--sunken);border-style:dashed;cursor:default}
.layer .ro{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-3);border:1px solid var(--line-2);border-radius:4px;padding:0 5px}
.layer .srcs{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.layer .srcs .mono{font-size:10.5px;color:var(--fg);padding:0 5px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);white-space:nowrap}
.arrowup{display:flex;justify-content:center;color:var(--fg-3);padding:3px 0}
.arrowup .i{transform:rotate(180deg)}
.ctxsel{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.ctxsel .seg{display:grid;grid-template-columns:1fr 1fr}
.ctxsel .seg button{display:inline-flex;align-items:center;gap:6px;justify-content:flex-start}
.stack .layer{padding:8px 11px;gap:4px}
.stack .arrowup{padding:1px 0}
.stack .arrowup .i{width:12px;height:12px}
.eff-b .note{margin:12px 0 4px}
.note{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--fg-2);padding:9px 10px;border:1px solid var(--line);border-radius:var(--r2);background:var(--win);margin-top:12px;line-height:1.45}
.note .i{color:var(--fg-3);margin-top:1px}
.provs{display:flex;gap:4px;flex-wrap:wrap}
.prov.a{color:var(--fg)}
.prov.wasl{color:var(--accent-fg);background:var(--accent);border-color:var(--accent)}
.prov.g{color:var(--fg-2)}
.etab tr.uns .nm,.etab tr.uns .ds,.etab tr.uns .prov,.etab tr.uns td.src{opacity:.5}
.etab .src{font-family:var(--f-mono);font-size:11px;color:var(--fg-3);white-space:nowrap}
.etab tr.wasl td{background:var(--accent-bg)}
.lockcell{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--fg-3);white-space:nowrap}

@media (max-width:1240px){
  .gx{grid-template-columns:1fr 300px}
  .sd-body{grid-template-columns:1fr 236px}
  .hs{grid-template-columns:1fr 340px}
  .ac{grid-template-columns:330px 1fr}
}
@media (max-width:1100px){
  .toolbar .input{width:200px!important} .toolbar .chip.hide-n{display:none}
  .ibx-head,.ibx-row{grid-template-columns:108px minmax(190px,1.5fr) 44px 128px minmax(150px,1.2fr) 56px 54px;gap:10px}
  .ibx-row .drv span,.ibx-head .drvh{font-size:0}

/* ---------- Developer mode: diagnostics (Settings, session tab, host section) ---------- */
.dg{display:flex;flex-direction:column;gap:18px;padding:16px 20px;overflow:hidden auto;min-height:0;flex:1;overflow-wrap:anywhere}
.dg section{display:flex;flex-direction:column;gap:8px;min-width:0}
.dg-top{display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:start}
.dg-copy{display:flex;flex-direction:column;gap:6px;align-items:flex-end;max-width:220px;text-align:right}
.dg-facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 28px;margin:0}
.dg-fact{display:flex;flex-direction:column;gap:1px;min-width:0}
.dg-fact dt{font-size:11px;color:var(--fg-3)} .dg-fact dd{display:flex;align-items:center;gap:6px;margin:0;font-size:12.5px;min-width:0}
.dg-sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap} .dg-sh h4{margin:0} .dg-sh .sp{flex:1}
.dg-toggle{display:flex;align-items:center;gap:8px;padding:2px 0;background:none;border:0;color:var(--fg);text-align:left}
.dg-problem{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--needs-line);background:var(--needs-bg);border-radius:var(--r2);font-size:12.5px}
.dg-problem .i{color:var(--needs);flex:none;margin-top:1px} .dg-problem .pt{flex:1}
.dgp{border:1px solid var(--line);background:var(--surface);border-radius:var(--r3);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.dgp-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .dgp-h .sp{flex:1}
.dgp-path{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px}
.dgp-step{display:inline-flex;align-items:center;gap:2px} .dgp-step>.i{color:var(--fg-3)}
.dgp-chip{display:inline-flex;flex-direction:column;gap:1px;padding:4px 9px;border-radius:var(--r2);border:1px solid var(--line-2);background:var(--surface-2);min-width:70px}
.dgp-lbl{font-size:12px;font-weight:600;color:var(--fg)} .dgp-time{font-size:11px;color:var(--fg-2)} .dgp-src{font-size:10.5px;color:var(--fg-3)}
.dgp-step.hollow .dgp-chip{background:transparent;border-style:dashed}
.dgp-step.hollow .dgp-lbl{color:var(--fg-3);font-weight:500} .dgp-step.hollow .dgp-time{color:var(--fg-3);font-style:italic}
.dgp-step.ok .dgp-chip{border-color:var(--done-line);background:var(--done-bg)}
.dgp-step.bad .dgp-chip{border-color:var(--failed-line);background:var(--failed-bg)} .dgp-step.bad .dgp-lbl{color:var(--failed)}
.dgp-notes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:11.5px}
.dgl{border:1px solid var(--line);border-radius:var(--r3);background:var(--sunken);overflow:hidden}
.dgr{border-bottom:1px solid var(--line)} .dgr:last-child{border-bottom:0}
.dgr-main{display:flex;align-items:baseline;gap:8px;width:100%;padding:5px 10px;background:none;border:0;color:var(--fg);text-align:left;font-size:12px}
.dgr-t{color:var(--fg-3);flex:none;font-size:11px;font-family:var(--f-mono)}
.dgr-dot{width:7px;height:7px;border-radius:50%;background:var(--idle);flex:none;align-self:center}
.dgr.ok .dgr-dot{background:var(--done)} .dgr.warn .dgr-dot{background:var(--needs)} .dgr.bad .dgr-dot{background:var(--failed)}
.dgr.bad .dgr-w{color:var(--failed)} .dgr-w{flex:1;min-width:0} .dgr-x{color:var(--fg-3);align-self:center}
.dgr-f{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;padding:6px 10px 8px 34px;font-size:11px;color:var(--fg-2);background:var(--surface);font-family:var(--f-mono)}
.dgr-f dt{color:var(--fg-3)} .dgr-f dd{margin:0}
.dga{border:1px solid var(--line);background:var(--surface);border-radius:var(--r3);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.dga.bad{border-color:var(--failed-line)} .dga.ok{border-color:var(--done-line)}
.dga-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dga-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:11.5px}
.dga-step{display:grid;grid-template-columns:62px 1fr;gap:8px} .dga-step.bad{color:var(--failed)} .dga-step.ok{color:var(--done)}
.dga-t{font-size:11px;text-align:right;color:var(--fg-3);font-family:var(--f-mono)}
.dga-fail{border-top:1px solid var(--failed-line);padding-top:6px;display:flex;flex-direction:column;gap:4px;font-size:12px}
.dga-err{margin:0;padding:6px 8px;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r2);white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;font-family:var(--f-mono)}
/* Export diagnostics (Settings → Diagnostics) */
.dgx-note{margin:0;padding:12px 0 4px;line-height:1.5;font-size:12px}
.dgx-pick{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)} .dgx-pick .sp{flex:1}
.dgx-cur{display:flex;flex-direction:column;gap:10px;padding:12px 0}
.dgx-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .dgx-head .sp{flex:1}
.dgx-src{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r3);background:var(--sunken)}
.dgx-row{display:grid;grid-template-columns:minmax(120px,200px) minmax(110px,150px) 70px 1fr;gap:4px 12px;align-items:baseline;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12.5px} .dgx-row:last-child{border-bottom:0}
.dgx-st{display:inline-flex;align-items:center;gap:6px} .dgx-st.ok{color:var(--done)} .dgx-st.warn{color:var(--needs)} .dgx-st.bad{color:var(--failed)} .dgx-st.info{color:var(--working)} .dgx-st.plain{color:var(--fg-2)}
.dgx-sz{text-align:right;font-size:12px;color:var(--fg-3)} .dgx-why{font-size:12px;color:var(--fg-3);min-width:0}
.dgx-acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dgx-pick .btn[disabled]{opacity:.5;cursor:not-allowed}
</style>

   ${a.fail?`<div class="dga-fail"><div>Failed at <b>${a.fail[0]}</b> (${a.fail[1]}) · exit code <b>${a.fail[2]}</b></div><pre class="dga-err" aria-label="What the host's shell wrote (scrubbed)">${a.fail[3]}</pre></div>`:''}</div>`;
}
function diagHost(local){
  const aside=local
   ?`<aside class="hd"><div style="display:flex;align-items:center;gap:10px">${I('i-laptop','lg')}<div><div class="h2">thinkpad-x1</div><div class="faint" style="font-size:12px">Ubuntu 24.04 · x86_64 · Local</div></div></div>
     <div><h4 class="eyebrow" style="margin:0 0 8px">Connection</h4><dl class="kvl"><dt>Address</dt><dd class="mono">this machine</dd><dt>Status</dt><dd>Connected</dd></dl></div>
     <div class="dg" style="padding:0;gap:12px;overflow:visible"><h4 class="eyebrow">Diagnostics</h4>
      <div class="faint" style="font-size:12px">This is the local host: this app reaches it through the local service (the hub), so there is no connection to log. This is the hub daemon's own log.</div>
      <section>${dgHead('Local service log',"From this computer's daemon.")}<div class="dgl">${dgRow('09:12:03.220','','Daemon started (hub x1, build 0.7.3, pid 4242)')}${dgRow('09:12:03.432','','Daemon ready in 212 ms (environment 120 ms, adopting sessions 31 ms, node 9 ms)')}${dgRow('09:12:04.601','ok','Attempt 1 connected after 482 ms')}${dgRow('11:02:09.771','warn','The connection to win closed (an I/O error) after being up 120 min 0 s, the transport exited with code 255 — Connection reset by peer')}${dgRow('14:02:11.400','','session.command (0 hops) ok in 12 ms')}</div></section></div></aside>`
   :`<aside class="hd"><div style="display:flex;align-items:center;gap:10px">${I('i-monitor','lg')}<div><div class="h2">win-build</div><div class="faint" style="font-size:12px">Windows 11 Pro · x86_64 · SSH</div></div><span class="sp" style="flex:1"></span>${conn('warn','Reconnecting in 4s')}</div>
     <div class="gate" style="border-color:var(--needs-line)"><div class="gate-h">${I('i-refresh','sm')}Reconnecting in 4s</div><div style="font-size:12.5px">The connection dropped (connection reset by peer). Attempt 3.</div><div class="acts"><button class="btn sm">${I('i-refresh','xs')}Retry now</button></div></div>
     <div class="dg" style="padding:0;gap:12px;overflow:visible"><h4 class="eyebrow">Diagnostics</h4>
      <section>${dgHead('Connection log','From the hub, by attempt.')}
       ${dgAttempt({title:'Attempt 1',at:'09:12:03.700',out:['ok','Connected'],ms:'482 ms',cls:'ok',steps:[['+0 ms','Connecting to win — attempt 1 began'],['+4 ms','Started ssh for win (attempt 1; 9 arguments, pid 21001)'],['+6 ms','Bootstrap attempt 1: powershell shell, first contact'],['+392 ms','The host reports windows/x86_64, helper 0.7.3 (372 ms)'],['+431 ms','The helper started on the host in 38 ms'],['+475 ms','The helper answered (build 0.7.3) in 44 ms'],['+482 ms','Attempt 1 connected after 482 ms','ok']]})}
       ${dgAttempt({title:'Attempt 2',at:'13:04:07.100',out:['warn','Failed, will retry'],ms:'10 s',cls:'bad',steps:[['+0 ms','Connecting to win — attempt 2 began'],['+5 ms','Started ssh for win (attempt 2; 9 arguments, pid 21002)'],['+10 s','The transport to win exited (attempt 2) with code 255; 62 B of error output'],['+10 s','Bootstrap failed at spawn (unreachable), exit code 255','bad']],fail:['spawn','unreachable','255','ssh: connect to host win-build.lan port 22: Connection timed out']})}
       ${dgAttempt({title:'Attempt 3',at:'13:05:09.100',out:['warn','Failed, will retry'],ms:'10 s',cls:'bad',steps:[['+0 ms','Connecting to win — attempt 3 began'],['+5 ms','Started ssh for win (attempt 3; 9 arguments, pid 21003)'],['+10 s','The transport to win exited (attempt 3) with code 255; 62 B of error output'],['+10 s','Bootstrap failed at spawn (unreachable), exit code 255','bad']],fail:['spawn','unreachable','255','ssh: connect to host win-build.lan port 22: Connection reset by peer']})}
      </section>
      <div class="faint" style="font-size:12px">win-build's own log is read while it is connected.</div></div></aside>`;
  return `<div class="ph"><h1 class="h1">Hosts</h1><span class="muted" style="font-size:12.5px">5 machines · 3 connected</span></div><div class="hs">${hostsList(local?'x1':'win')}${aside}</div>`;
}
function diagScreen(v){
  return v==='s'?diagSettings('idle'):v==='x'?diagSettings('running'):v==='y'?diagSettings('done'):v==='z'?diagSettings('failed'):v==='u'?diagSettings('down'):v==='p'?diagSessionLocal():v==='r'?diagSessionRemote():diagHost(v==='l');
}

/* ================= RENDER ================= */
function render(){
  const m=document.getElementById('main');
  const sc=state.screen, v=state.vars[sc];
  let html='';
  if(sc==='home') html=v==='c'?homeC():homeA();
  else if(sc==='session') html=sessionScreen();
  else if(sc==='workstreams') html=v==='new'?newWsDialog():workstreamsList();
  else if(sc==='graph') html=v==='design'?designScreen():graphScreen();
  else if(sc==='new') html=newScreen();
  else if(sc==='config') html=configScreen();
  else if(sc==='hosts') html=v==='a'?hostsA():hostsB();
  else if(sc==='gates') html=v==='a'?gatesA():gatesB();
  else if(sc==='diag') html=diagScreen(v);
  m.innerHTML=html;
  document.getElementById('overlay').innerHTML=state.gateOpen?`<div style="position:absolute;inset:40px 0 26px 78px;z-index:40">${gateOverlay(state.gateOpen)}</div>`:'';
  const tr=m.querySelector('.transcript'); if(tr) tr.scrollTop=tr.scrollHeight;
  renderReview(); writeHash();
}
function go(sc,v){ state.screen=sc; if(v) state.vars[sc]=v; state.gateOpen=null; render(); }
function closeMenu(){ const m=document.getElementById('split-menu'); if(m&&!m.hidden){ m.hidden=true; document.getElementById('split-caret').setAttribute('aria-expanded','false'); } }

document.addEventListener('click',e=>{
  if(e.target.closest('input,textarea')) return;
  const t=e.target.closest('[data-selrow],[data-sc],[data-v],[data-t],[data-go],[data-tab],[data-node],[data-edge],[data-gate],[data-gt],[data-close],[data-qo],[data-q],[data-v-go],#slash-btn,#split-caret,#strip-tg,#quiet-on,#quiet-off,[data-gdrv],[data-cdrv],[data-ws-start],[data-jump],[data-term]');
  if(!t||t.id!=='split-caret') closeMenu();
  if(!t) return;
  if(t.id==='split-caret'){ const m=document.getElementById('split-menu'); m.hidden=!m.hidden; t.setAttribute('aria-expanded',String(!m.hidden)); return; }
  if(t.dataset.term){ state.term=t.dataset.term; render(); return; }
  if(t.id==='strip-tg'){ state.strip=!state.strip; render(); return; }
  if(t.id==='quiet-on'||t.id==='quiet-off'){ state.quiet=t.id==='quiet-on'; render(); return; }
  if(t.dataset.gdrv){ state.gdrv=t.dataset.gdrv; render(); return; }
  if(t.dataset.cdrv){ state.cdrv=t.dataset.cdrv; render(); return; }
  if(t.dataset.wsStart){ state.wstart=t.dataset.wsStart; render(); return; }
  if(t.dataset.selrow){ state.sel=t.dataset.selrow; render(); return; }
  if(t.dataset.sc){ go(t.dataset.sc); return; }
  if(t.dataset.v){ state.vars[state.screen]=t.dataset.v; render(); return; }
  if(t.dataset.t){ document.documentElement.setAttribute('data-theme',t.dataset.t); try{localStorage.setItem('marsad-review-theme',t.dataset.t)}catch(_){} renderReview(); return; }
  if(t.dataset.gate){ e.stopPropagation(); if(state.screen==='gates'){state.gtab=t.dataset.gate;render();} else {state.gateOpen=t.dataset.gate; render();} return; }
  if(t.dataset.gt){ if(state.gateOpen){state.gateOpen=t.dataset.gt;} else state.gtab=t.dataset.gt; render(); return; }
  if(t.hasAttribute('data-close')){ if(state.gateOpen){state.gateOpen=null;render();} else go('home','a'); return; }
  if(t.dataset.vGo){ state.vars[state.screen]=t.dataset.vGo; render(); return; }
  if(t.dataset.jump){ e.preventDefault(); const el=document.getElementById(t.dataset.jump); el&&el.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  if(t.dataset.qo!==undefined){ state.qopt=+t.dataset.qo; render(); return; }
  if(t.dataset.q!==undefined){ e.stopPropagation(); state.ibxq.s7=+t.dataset.q; render(); return; }
  if(t.id==='slash-btn'){ state.slash=!state.slash; render(); return; }
  if(t.dataset.tab){ state.tab=t.dataset.tab; render(); return; }
  if(t.dataset.node){ state.gsel=t.dataset.node; render(); return; }
  if(t.dataset.edge){ state.gsel=null; state.edge=t.dataset.edge; render(); return; }
  if(t.dataset.go){
    if(e.target.closest('button')&&e.target.closest('button')!==t&&!e.target.closest('button').dataset.go) return;
    const [g,gv]=t.dataset.go.split(':');
    if(g==='notify') go('gates','b'); else go(g,gv);
  }
});
document.addEventListener('input',e=>{ if(e.target.id==='composer-ta'){ const on=e.target.value.startsWith('/'); if(on!==state.slash){state.slash=on; const pos=e.target.value; render(); const ta=document.getElementById('composer-ta'); if(ta){ta.value=pos;ta.focus();}}}});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeMenu(); if(state.gateOpen){state.gateOpen=null;render();} } });
window.addEventListener('hashchange',()=>{readHash();render();});
try{const th=localStorage.getItem('marsad-review-theme'); if(th) document.documentElement.setAttribute('data-theme',th);}catch(_){}
readHash(); render();
</script>
