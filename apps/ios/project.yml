# XcodeGen project definition. Run `xcodegen generate` on a Mac to produce the
# .xcodeproj (intentionally gitignored). The UniFFI-generated Swift bindings for
# marsad-core are added as a local package / generated sources by the build step.
name: Marsad
options:
  bundleIdPrefix: com.mewais
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
targets:
  Marsad:
    type: application
    platform: iOS
    sources:
      - Marsad
    info:
      path: Marsad/Info.plist
      properties:
        CFBundleDisplayName: Marsad
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mewais.marsad
  MarsadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MarsadTests
    dependencies:
      - target: Marsad
