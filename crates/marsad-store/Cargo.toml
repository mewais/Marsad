[package]
name = "marsad-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Persistence: sessions/transcripts/workspaces, snapshot/restore, .marsad.json"

[lints.rust]
# cargo-llvm-cov sets cfg(coverage); declare it here to silence the
# unexpected_cfg warning without requiring a build script.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
marsad-proto = { workspace = true }
marsad-events = { workspace = true }
marsad-gates = { workspace = true }
marsad-workstream = { workspace = true }
