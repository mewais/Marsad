[package]
name = "marsad-winshim"
version.workspace = true
edition.workspace = true
publish = false
description = "Windows session-host shim: owns Named Pipe server ends and claude child process"

# This binary target is declared so `cargo build --workspace` succeeds
# on Linux/macOS too.  On non-Windows the entire body is a compile-time no-op
# (the OS-specific code is gated #[cfg(windows)]).

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }
