[package]
name = "marsad-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Marsad host daemon: Wasit session runtime + git, terminal, file-browsing and agent-config services; on the GUI machine also the hub (hosts, provisioning, fleet, store)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "marsad-agent"
path = "src/main.rs"

[features]
# `marsad-agent serve --panic-test <marker>`: panics with a message holding the marker once the
# daemon's diagnostics are running. For tests/diag_panic.rs; enabled by this package's
# dev-dependency on itself below, so no build for use has it.
panic-test = []

[dependencies]
marsad-proto = { workspace = true }
marsad-store = { workspace = true }
wasit-core = { workspace = true }
wasit-control = { workspace = true }
wasit-process = { workspace = true }
wasit-diag = { workspace = true }
wasit-runtime = { workspace = true }
wasit-shim = { workspace = true }
wasl-proto = { workspace = true }
wasl-node = { workspace = true }
wasl-mcp = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
fastrand = { workspace = true }
portable-pty = "0.9"
rmcp = { version = "0.9", features = ["server", "transport-io"] }
base64 = "0.22"
tokio-util = { version = "0.7", features = ["rt"] }
miniz_oxide = "0.9.1"
sha2 = "0.10"

[dev-dependencies]
marsad-agent = { path = ".", features = ["panic-test"] }
tokio = { workspace = true, features = ["test-util"] }
marsad-client = { workspace = true }
wasit-fake-cli = { workspace = true }
