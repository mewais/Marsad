[package]
name = "marsad-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Detached supervisor daemon: owns claude processes, serves IPC, fires hooks"
# Disable auto-discovery of src/main.rs as a binary target so that
# cargo-llvm-cov does not instrument the binary entry point (which is
# unreachable from unit tests and would permanently show 0% coverage).
# The binary is declared explicitly below so the crate still ships a daemon.
# Under `cfg(coverage)` (set by cargo-llvm-cov) `main` compiles to an empty
# stub (see src/main.rs), so the measured surface stays 100%.
autobins = false

[[bin]]
name = "marsad-agent"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
marsad-proto = { workspace = true }
marsad-events = { workspace = true }
marsad-gates = { workspace = true }
marsad-transport = { workspace = true }
marsad-lifecycle = { workspace = true }
marsad-store = { workspace = true }
marsad-hosts = { workspace = true }
marsad-notify = { workspace = true }
marsad-wasl = { workspace = true }
marsad-wasl-session = { workspace = true }
# WAVE 3b — interactive PTY escape-hatch terminal (Terminal tab). Cross-platform
# pty allocation + child spawning (real OS IO, gated `#[cfg(not(coverage))]` in
# pty.rs); base64 encodes raw pty output bytes for the IPC wire (see
# `marsad_proto::IpcMsg::PtyOutput`'s doc comment for why plain UTF-8 isn't safe).
portable-pty = "0.9"
base64 = "0.22"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
# tests/capabilities.rs (frozen, test-agent-owned) has a `let _ = wait_for(...)`
# binding whose closure returns `Option<()>` — a deliberate "wait for this
# condition, discard the unit" idiom used throughout that suite. Package-level
# lint config applies uniformly to src/ and tests/ targets; allowed here
# rather than editing the frozen test file.
let_unit_value = "allow"
