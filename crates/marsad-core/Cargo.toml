[package]
name = "marsad-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Facade tying B01-B11 into desktop/phone API; UniFFI surface; agent client"

[lints.rust]
# cargo-llvm-cov sets cfg(coverage); declare it here to silence the
# unexpected_cfg warning without requiring a build script.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
# tests/wasl.rs (frozen, test-agent-owned) has an 8-argument `view(...)`
# golden-builder helper (docs/specs/wasl-connector.md §7.6's WaslGateView test
# fixture). Package-level lint config applies uniformly to src/ and tests/
# targets; allowed here rather than editing the frozen test file (mirrors
# marsad-agent's Cargo.toml `let_unit_value` precedent for the same reason).
too_many_arguments = "allow"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
marsad-proto = { workspace = true }
marsad-events = { workspace = true }
marsad-gates = { workspace = true }
marsad-diff = { workspace = true }
marsad-format = { workspace = true }
marsad-store = { workspace = true }
marsad-hosts = { workspace = true }
marsad-transport = { workspace = true }
marsad-lifecycle = { workspace = true }
marsad-notify = { workspace = true }
marsad-viewmodel = { workspace = true }
marsad-workstream = { workspace = true }
marsad-wasl = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
