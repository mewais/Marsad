[package]
name = "marsad-lifecycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Reconnect-or-resume algorithm + Container trait (tmux/ConPTY/fake)"

[lints.rust]
# cargo-llvm-cov sets cfg(coverage); declare it here to silence the
# unexpected_cfg warning without requiring a build script.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }

# Windows Named Pipe + process-management APIs used by WindowsShimContainer.
# Only pulled in on Windows; harmless on Linux (the cfg gate on the usage site
# is #[cfg(all(windows, not(coverage)))] which implies cfg(windows), so
# cargo correctly skips this dependency on non-Windows targets).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
