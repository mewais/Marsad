[package]
name = "marsad-it-i16_wasl_a2a_live"
version.workspace = true
edition.workspace = true
publish = false
description = "Marsad integration scenario i16 — headless live multinode Wasl: dynamic peer registration against a real wasl-mcpd (gap 1) + node->node A2A send with a send-gate surfaced+answered through Marsad's operator connector (gap 2)"

[dependencies]
marsad-agent = { workspace = true }
marsad-wasl-session = { workspace = true }
marsad-wasl = { workspace = true }
serde_json = { workspace = true }
# S2 drives node A as a real rmcp MCP client (spawn wasl-mcpd as a child over
# stdio, call the `consult` tool) — the deterministic trigger that lets the test
# control ordering (register_peer BEFORE the send), which Wasl's `live_client`
# cannot (it spawns its node and consults immediately). Same rmcp major + client
# transport as `Wasl/crates/wasl-mcp`'s live_client example.
rmcp = { version = "0.9", features = ["client", "transport-child-process", "transport-async-rw"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
